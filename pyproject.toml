[project]
name = "vylovo"
version = "0.1.0"
description = ""
authors = [
    {name = "andrii-chumak",email = "andrii.chumak.dev@gmail.com"}
]
requires-python = ">=3.12, <3.16"
dependencies = [
    "aiogram (>=3.33.0,<4.0.0)",
    "telethon (>=1.46.0,<2.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "pgvector (>=0.5.1,<0.6.0)",
    "supabase (>=2.34.1,<3.0.0)",
    "google-genai (>=3.6.1,<4.0.0)",
    "aiohttp (>=3.14.5,<4.0.0)",
    "pydantic-settings (>=2.16.3,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.5,<0.18.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.5.0,<2.0.0)"
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []