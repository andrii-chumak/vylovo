[project]
name = "vylovo"
version = "0.1.0"
description = ""
authors = [
    {name = "andrii-chumak",email = "andrii.chumak.dev@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.5,<0.18.0)",
    "pre-commit (>=4.7.0,<5.0.0)"
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []